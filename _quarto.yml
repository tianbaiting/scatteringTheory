project:
  type: book
  output-dir: _site

book:
  title: "散射理论 · 中文教学仓库"
  author: "Baiting Tian"
  date: today
  search: true
  chapters:
    - index.qmd
    - part: "Part I — 核心理论"
      chapters:
        - chapters/01_free_particle.qmd
        - chapters/02_smatrix_cross_section.qmd
        - chapters/03_lippmann_schwinger.qmd
        - chapters/04_born.qmd
        - chapters/05_partial_wave.qmd
        - chapters/06_spin.qmd
        - chapters/07_analytic_structure.qmd
        - chapters/08_resonances.qmd
        - chapters/09_coulomb.qmd
        - chapters/10_multichannel.qmd
        - chapters/11_three_body.qmd
        - chapters/12_inverse_scattering.qmd
        - chapters/13_eikonal.qmd
        - chapters/14_semiclassical.qmd
        - chapters/15_dispersion.qmd
        - chapters/16_optical_potential.qmd
    - part: "Part II — 具体势能"
      chapters:
        - examples/1d_delta.qmd
        - examples/square_well_3d.qmd
        - examples/delta_shell.qmd
        - examples/yukawa.qmd
        - examples/separable_rank1.qmd
        - examples/poschl_teller.qmd
        - examples/double_delta.qmd
  appendices:
    - appendix/A_math_foundations.qmd
    - appendix/B_numerical_methods.qmd
    - appendix/C_invariance.qmd
    - appendix/D_kinematics.qmd
    - appendix/E_modern_numerics.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    fig-cap-location: bottom
    html-math-method: mathjax
    mainfont: "Noto Sans CJK SC"
    monofont: "JetBrains Mono"

execute:
  echo: true
  warning: false
  freeze: auto
  cache: false

lang: zh
